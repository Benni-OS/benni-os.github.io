<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cyberGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#426bff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00ffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="meshGlow" cx="20%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8e1d5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#cyberGlow)"/>
  <rect width="1200" height="630" fill="url(#meshGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border & Technical Framing -->
  <rect x="24" y="24" width="1152" height="582" rx="8" stroke="#e8e1d5" stroke-opacity="0.12" stroke-width="1.5" fill="none"/>
  
  <!-- Technical Top Header -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#00ff66"/>
    <text x="24" y="12" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#00ff66" letter-spacing="2">BENNI OS // SYSTEM ACTIVE</text>
    <text x="750" y="12" font-family="IBM Plex Mono, monospace" font-size="14" fill="#00ffff" letter-spacing="1">VERIFIABLE_LEDGER: SHA-256</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="420" height="34" rx="4" fill="#141418" stroke="#426bff" stroke-width="1.5"/>
    <text x="18" y="22" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#00ffff" letter-spacing="1.5">BENNI OS // CORE ARCHITECTURE</text>
  </g>

  <!-- Title & Subtitle -->
  
            <text x="100" y="320" font-family="DM Serif Display, serif" font-size="56" font-weight="700" fill="#e8e1d5" letter-spacing="-0.5">Benni Autonomous Revenue Loop</text>
            

  <text x="100" y="420" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" fill="#8e8e99" max-width="900">
    Loop de receita autônomo para aquisição, qualificação, conversão e retenção orientada a dados.
  </text>

  <!-- Decorative Circuit lines -->
  <path d="M 850 500 L 1050 500 L 1100 550" stroke="#426bff" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <circle cx="1100" cy="550" r="4" fill="#00ffff"/>

  <!-- Bottom Bar -->
  <g transform="translate(100, 545)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#e8e1d5" stroke-opacity="0.12" stroke-width="1"/>
    <text x="0" y="32" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#e8e1d5">BENNI OS ACADEMY &amp; ARCHITECTURE</text>
    <text x="780" y="32" font-family="IBM Plex Mono, monospace" font-size="14" fill="#c9a45c">SOVEREIGN COMPUTING TIER-0</text>
  </g>
</svg>